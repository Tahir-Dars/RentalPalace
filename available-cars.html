<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Rental House | Available Cars</title>
  <meta name="description" content="Browse available rental cars with live search and filters." />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="available-cars.css" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
      <div class="container py-2">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="brand-mark">CR</span>
          <span class="brand-text">Car Rental House</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="available-cars.html">Cars</a></li>
            <li class="nav-item"><a class="nav-link" href="booking.html">My Booking</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="pb-5">
    <section class="heading-section pt-5 pb-4">
      <div class="container">
        <h1 class="page-title">Available Cars</h1>
        <p class="page-subtitle">Search and filter to find the best car for your trip.</p>
      </div>
    </section>

    <section class="filters-section">
      <div class="container">
        <div class="filters-card">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-4">
              <label for="searchInput" class="form-label">Search by Name or Brand</label>
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="e.g. BMW, Camry"
              />
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label for="typeFilter" class="form-label">Car Type</label>
              <select id="typeFilter" class="form-select">
                <option value="all">All Types</option>
              </select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label for="brandFilter" class="form-label">Brand</label>
              <select id="brandFilter" class="form-select">
                <option value="all">All Brands</option>
              </select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label for="transmissionFilter" class="form-label">Transmission</label>
              <select id="transmissionFilter" class="form-select">
                <option value="all">All</option>
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
              </select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
              <label for="priceFilter" class="form-label">Price Range</label>
              <select id="priceFilter" class="form-select">
                <option value="all">All Prices</option>
                <option value="50">Up to $50/day</option>
                <option value="80">Up to $80/day</option>
                <option value="120">Up to $120/day</option>
                <option value="200">Up to $200/day</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
            <p id="resultsCount" class="results-count mb-0"></p>
            <button id="resetFiltersBtn" class="btn btn-outline-secondary btn-sm" type="button">Reset Filters</button>
          </div>
        </div>
      </div>
    </section>

    <section class="cars-grid-section pt-4">
      <div class="container">
        <div id="carsGrid" class="row g-4"></div>
        <div id="emptyState" class="empty-state d-none mt-4">
          <h2>No cars found</h2>
          <p>Try adjusting your search or filter options.</p>
        </div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="available-cars.js"></script>
</body>
</html>
