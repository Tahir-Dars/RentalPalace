<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Rental House | Car Details</title>
  <meta name="description" content="Detailed rental information for selected car." />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="shared-layout.css" />
  <link rel="stylesheet" href="car-details.css" />
</head>
<body data-nav="cars">
  <header id="siteHeader"></header>

  <main class="py-5">
    <div class="container">
      <p class="mb-3">
        <a href="available-cars.html" class="back-link">&larr; Back to Available Cars</a>
      </p>

      <div class="details-card">
        <div class="row g-4 align-items-start">
          <div class="col-12 col-lg-6">
            <img id="carImage" src="" alt="Selected car" class="details-image" />
          </div>

          <div class="col-12 col-lg-6">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
              <h1 id="carName" class="details-title mb-1">Car Details</h1>
              <p id="carPrice" class="price-badge mb-0"></p>
            </div>

            <div class="spec-grid mt-3">
              <div class="spec-item"><span>Type</span><strong id="carType"></strong></div>
              <div class="spec-item"><span>Seats</span><strong id="carSeats"></strong></div>
              <div class="spec-item"><span>Transmission</span><strong id="carTransmission"></strong></div>
              <div class="spec-item"><span>Fuel Type</span><strong id="carFuel"></strong></div>
              <div class="spec-item"><span>Model Year</span><strong id="carYear"></strong></div>
            </div>

            <section class="mt-4">
              <h2 class="section-heading">Features</h2>
              <ul id="carFeatures" class="features-list"></ul>
            </section>

            <section class="mt-3">
              <h2 class="section-heading">Description</h2>
              <p id="carDescription" class="section-text"></p>
            </section>

            <section class="mt-3">
              <h2 class="section-heading">Rental Conditions</h2>
              <p id="carConditions" class="section-text"></p>
            </section>

            <button id="rentCarBtn" class="btn btn-primary btn-lg rent-btn mt-4" type="button">
              Rent This Car
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="shared-layout.js"></script>
  <script src="car-details.js"></script>
</body>
</html>
