<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Rental House | My Booking</title>
  <meta name="description" content="View and manage your active car rental booking." />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="shared-layout.css" />
  <link rel="stylesheet" href="my-booking.css" />
</head>
<body data-nav="booking">
  <header id="siteHeader"></header>

  <main class="py-5">
    <div class="container">
      <h1 class="page-title mb-4">My Booking</h1>

      <div id="bookingMessage" class="alert d-none" role="status" aria-live="polite"></div>

      <section id="emptyState" class="empty-state d-none">
        <h2>You don't have any active bookings.</h2>
        <p>Explore cars and make your first booking in a few clicks.</p>
        <a class="btn btn-primary" href="available-cars.html">Browse Cars</a>
      </section>

      <section id="bookingCard" class="booking-card d-none">
        <div class="row g-4 align-items-start">
          <div class="col-12 col-lg-5">
            <img id="carImage" src="" alt="Booked car" class="car-image" />
          </div>
          <div class="col-12 col-lg-7">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
              <h2 id="carName" class="car-name mb-0"></h2>
              <span id="bookingStatus" class="status-badge"></span>
            </div>

            <div class="detail-row"><span>Booking ID</span><strong id="bookingId"></strong></div>
            <div class="detail-row"><span>Pickup location</span><strong id="pickupLocation"></strong></div>
            <div class="detail-row"><span>Pickup date & time</span><strong id="pickupDateTime"></strong></div>
            <div class="detail-row"><span>Return date</span><strong id="returnDate"></strong></div>
            <div class="detail-row"><span>Rental days</span><strong id="rentalDays"></strong></div>
            <div class="detail-row"><span>Price per day</span><strong id="pricePerDay"></strong></div>
            <div class="detail-row total"><span>Total rental price</span><strong id="totalPrice"></strong></div>

            <div class="btn-row mt-4">
              <button id="cancelBookingBtn" class="btn btn-outline-danger" type="button">Cancel Booking</button>
              <button id="modifyBookingBtn" class="btn btn-primary" type="button">Modify Booking</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="shared-layout.js"></script>
  <script src="my-booking.js"></script>
</body>
</html>
